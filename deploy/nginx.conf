# Splitly — nginx for the API (api.splitly.shop).
#
# The rule this file exists to get right:
#
#     client_max_body_size must be LARGER than any limit Express sets, so that
#     Express is the thing that refuses an oversized request.
#
# ## Why that matters, since either one "works"
#
# nginx's default is 1 MB, and when it refuses a request it does so before Node
# sees a single byte. What the caller gets back is nginx's own HTML page:
#
#     HTTP/1.1 413 Request Entity Too Large
#     Server: nginx/1.30.1
#     Content-Type: text/html
#
# No JSON, no error code, nothing the admin editor can parse or display. The
# symptom that was reported is exactly what that produces: a 2 MB cover image
# fails to upload, the network tab shows a bare 413, and nothing appears in the
# API's own logs — because the request never reached them.
#
# With the limit set above Express's, the same oversized upload is refused by
# `src/app.js`'s per-route parsers instead, and comes back as the documented
# failure envelope with `code: "PAYLOAD_TOO_LARGE"` and a sentence naming the
# limit. Same refusal, in a form the client can act on.
#
# ## Where the number comes from
#
# The largest limit in `src/app.js` is 10 mb, on the two blog admin routes. A base64
# data URL inflates an image by a third, so `BLOG_MAX_IMAGE_MB=5` needs roughly
# 6.7 MB of JSON, and the 10 mb parser is what actually bounds it. 12m leaves
# headroom over that and still refuses anything absurd at the edge.
#
# **Raise this whenever a parser limit in app.js is raised.** The two are set
# together; changing one alone shows up as an upload that fails with no JSON,
# which is the failure this whole comment exists to prevent.

server {
  # `http2 on` rather than the `listen ... http2` form, which nginx has deprecated
  # since 1.25 and warns about on this box (1.30).
  listen 443 ssl;
  http2 on;
  server_name api.splitly.shop;

  # ssl_certificate / ssl_certificate_key — managed by certbot, left out here so
  # this file can be copied without clobbering them.

  # ── Request body ─────────────────────────────────────────────────────────────
  # See the note at the top. Must stay above the largest express.json limit.
  client_max_body_size 12m;

  location / {
    # The port `server.js` listens on. Loopback only — the API should not be
    # reachable except through this proxy, which is what terminates TLS and
    # applies the limit above.
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    # ── The socket, and why these two lines are not optional ──────────────────
    # The expense grid is realtime (docs/20-EXPENSE-SHEETS.md §11) and socket.io
    # upgrades an ordinary HTTP request to a WebSocket. Without the Upgrade and
    # Connection headers the handshake fails, socket.io silently falls back to
    # long-polling, and the only visible symptom is that live edits get slower
    # and heavier rather than stopping — which is the kind of thing nobody
    # notices for months.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Every client shares one rate-limit bucket unless the app is told ──────
    # The headers above are only half of it. Express still has to be configured
    # to believe them: set `TRUST_PROXY=1` in the API's environment, or
    # `req.ip` is the address of this proxy for every request on the server and
    # the rate limiter throttles all users as if they were one. The API logs a
    # warning at boot when it is unset — worth reading it.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

# socket.io's upgrade handshake needs this mapping; without it `$connection_upgrade`
# is empty and the header above is sent as `Connection: `. Belongs in the `http {}`
# block (nginx.conf itself, or a file in conf.d/), NOT inside `server {}`.
#
#   map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
#   }
